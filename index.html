<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f97316" />
<meta name="description" content="CloudBlitz CDEC Placement Training Classroom 2026" />
<title>CloudBlitz CDEC Placement Training Classroom</title>
<link rel="stylesheet" href="./src/styles.css?v=premium20261020" />
<link rel="stylesheet" href="./src/sop-visual.css?v=premium20261020" />

<link rel="stylesheet" href="./src/github-profile.css?v=premium20261020" />
<style>
:root{--cb-orange:#f97316;--cb-orange2:#ea580c;--cb-navy:#0b1220;--cb-ink:#172033;--cb-line:#e8edf4;--cb-shadow:0 18px 50px rgba(15,23,42,.10)}
body{background:linear-gradient(180deg,#f8fafc 0%,#fff 42%,#f8fafc 100%)}
.topbar{box-shadow:0 1px 0 rgba(15,23,42,.04),0 8px 28px rgba(15,23,42,.05);backdrop-filter:blur(14px)}
.brandmark{background:linear-gradient(135deg,#f97316,#fb923c 60%,#fdba74);box-shadow:0 10px 28px rgba(249,115,22,.28);position:relative;overflow:hidden}
.brandmark:after{content:"";position:absolute;inset:-60%;background:linear-gradient(90deg,transparent,#fff8,transparent);transform:rotate(25deg);animation:cbShine 5s linear infinite}
.hero{background:radial-gradient(circle at 82% 18%,rgba(249,115,22,.25),transparent 28%),linear-gradient(135deg,#08111f,#111827 52%,#431407);box-shadow:0 24px 65px rgba(15,23,42,.18);border:1px solid rgba(255,255,255,.08)}
.hero:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent);pointer-events:none}
.hero:after{width:380px;height:380px;right:-130px;top:-170px;background:radial-gradient(circle,rgba(249,115,22,.32),rgba(249,115,22,.04) 55%,transparent 70%);filter:blur(2px);animation:cbFloat 8s ease-in-out infinite}
.stats .stat,.card,.resource,.continue-card,.phase,.road-card,.topic-row,.asset-card{box-shadow:0 8px 28px rgba(15,23,42,.055);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.stats .stat:hover,.card.click:hover,.resource:hover,.phase:hover,.road-card:hover,.asset-card:hover{transform:translateY(-5px);box-shadow:var(--cb-shadow);border-color:#fdba74}
.section-title h3{letter-spacing:-.02em}
.section-title h3:before{content:"";display:inline-block;width:4px;height:20px;border-radius:4px;background:linear-gradient(#f97316,#fb923c);margin-right:9px;vertical-align:-4px}
.progress i{background:linear-gradient(90deg,#ea580c,#f97316,#fdba74);background-size:200% 100%;animation:cbProgress 3s linear infinite}
.journey-progress .progress{box-shadow:inset 0 1px 2px rgba(15,23,42,.08)}
.nav-btn{transition:background .18s ease,transform .18s ease,color .18s ease}.nav-btn:hover{transform:translateX(3px)}
.btn,.pill-btn{transition:transform .18s ease,box-shadow .18s ease}.btn:hover,.pill-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.12)}
.btn.orange,.pill-btn.primary{box-shadow:0 10px 25px rgba(249,115,22,.22)}
.quick-grid .card{position:relative;overflow:hidden}.quick-grid .card:after{content:"";position:absolute;width:90px;height:90px;right:-45px;bottom:-45px;border-radius:50%;background:rgba(249,115,22,.07);transition:transform .3s ease}.quick-grid .card:hover:after{transform:scale(1.7)}
.phase:nth-child(2){transform:translateY(5px)}.phase:nth-child(2):hover{transform:translateY(0)}
.walkthrough{box-shadow:0 18px 50px rgba(2,6,23,.18);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden}.walkthrough:after{content:"";position:absolute;inset:auto -10% -75% 35%;height:240px;border-radius:50%;background:rgba(249,115,22,.12);filter:blur(8px);pointer-events:none}
.walk-count{box-shadow:inset 0 0 35px rgba(249,115,22,.08),0 0 30px rgba(249,115,22,.08);animation:cbPulse 4s ease-in-out infinite}
.footer{opacity:.9}
@keyframes cbShine{0%{transform:translateX(-80%) rotate(25deg)}100%{transform:translateX(80%) rotate(25deg)}}
@keyframes cbFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-12px,16px,0)}}
@keyframes cbProgress{0%{background-position:0 0}100%{background-position:200% 0}}
@keyframes cbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@media(max-width:760px){.hero{border-radius:18px}.hero:after{width:240px;height:240px;right:-100px;top:-90px}.phase:nth-child(2){transform:none}.stats .stat:hover,.card.click:hover,.resource:hover,.phase:hover,.road-card:hover,.asset-card:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app"></div>

<script src="./src/linkedin-profile.js?v=premium20261020"></script>
<script src="./src/linkedin-integration.js?v=premium20261020"></script>
<script src="./src/github-profile.js?v=premium20261020"></script>
<script src="./src/github-integration.js?v=premium20261020"></script>
</body>
</html>
