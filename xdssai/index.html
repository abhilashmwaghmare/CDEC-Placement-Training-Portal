<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f97316"><meta name="description" content="CloudBlitz XDSSAI Placement Training Classroom 2026">
<title>CloudBlitz | XDSSAI Placement Training Classroom</title>
<style>
:root{--o:#f97316;--o2:#ea580c;--ink:#17202a;--muted:#667085;--line:#e7e9ee;--bg:#f5f7fa;--card:#fff;--dark:#111827;--soft:#fff7ed;--green:#12b76a;--shadow:0 12px 32px rgba(16,24,40,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit;cursor:pointer}.shell{min-height:100vh;display:flex}.side{width:255px;position:fixed;inset:0 auto 0 0;background:#111827;color:white;padding:20px 14px;z-index:20;display:flex;flex-direction:column}.brand{display:flex;gap:11px;align-items:center;padding:8px 8px 23px;border-bottom:1px solid #273244}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#fb923c,#ea580c);display:grid;place-items:center;font-weight:900}.brand b{display:block}.brand small{color:#aab3c1}.nav{margin-top:18px;display:grid;gap:5px}.nav button{border:0;background:none;color:#b8c1ce;text-align:left;padding:12px;border-radius:10px;font-weight:700}.nav button:hover,.nav button.active{background:#202938;color:white}.nav button.active{border-left:3px solid var(--o)}.sidefoot{margin-top:auto;color:#8f9aaa;font-size:11px}.bar{height:5px;background:#293446;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o);width:0}.main{margin-left:255px;width:calc(100% - 255px)}header{height:86px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:10}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--o);font-weight:900}header h1{font-size:21px;margin:4px 0}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:750}.btn.primary{background:var(--o);border-color:var(--o);color:#fff}.btn.primary:hover{background:var(--o2)}.content{padding:30px;max-width:1450px;margin:auto}.hero{background:linear-gradient(135deg,#111827,#263142 65%,#3b2417);color:#fff;border-radius:24px;padding:34px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:'';position:absolute;width:330px;height:330px;border:1px solid rgba(249,115,22,.25);border-radius:50%;right:-110px;top:-150px;box-shadow:0 0 0 35px rgba(249,115,22,.04),0 0 0 70px rgba(249,115,22,.02)}.pill{display:inline-block;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-size:10px;font-weight:850;letter-spacing:.08em}.hero h2{font-size:34px;line-height:1.1;max-width:820px;margin:13px 0 10px}.hero p{color:#c6ced8;line-height:1.6;max-width:800px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:5px}.section{display:flex;align-items:end;justify-content:space-between;margin:28px 0 12px}.section h3{margin:0}.section p{margin:4px 0 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:20px}.card.accent{border-top:3px solid var(--o)}.card h4{margin:0 0 8px}.card p,.card li{color:var(--muted);font-size:13px;line-height:1.55}.card ul{padding-left:18px}.timeline{display:grid;gap:11px}.day{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px 18px;display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:center}.day:hover{border-color:#fdba74;box-shadow:var(--shadow)}.dayno{font-size:13px;font-weight:900;color:var(--o)}.day h4{margin:0 0 5px}.day p{margin:0;color:var(--muted);font-size:12px}.phase{font-size:10px;color:#475467;margin-top:5px}.check{border:1px solid var(--line);background:#fff;width:34px;height:34px;border-radius:10px}.check.done{background:#ecfdf3;border-color:#abefc6;color:var(--green)}.detail{display:grid;grid-template-columns:1.5fr .7fr;gap:16px}.detailmain{background:#fff;border:1px solid var(--line);border-radius:20px;padding:25px;box-shadow:var(--shadow)}.detailmain h2{margin:5px 0 10px}.label{font-size:10px;letter-spacing:.13em;color:var(--o);font-weight:900}.topics{display:grid;gap:8px}.topic{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fafafa;font-size:13px}.callout{background:var(--soft);border:1px solid #fed7aa;padding:14px;border-radius:13px;margin-top:16px}.questions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.q b{font-size:13px}.q p{font-size:12px;color:var(--muted);line-height:1.5}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.step .num{width:35px;height:35px;border-radius:10px;background:var(--soft);color:var(--o);display:grid;place-items:center;font-weight:900;margin-bottom:12px}.step h4{margin:0 0 5px}.step p{font-size:12px;color:var(--muted);line-height:1.5}.progress{height:8px;background:#edf0f3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#fb923c,#ea580c);width:0}.hidden{display:none}.mobile{display:none}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.main{margin:0;width:100%}.mobile{display:block}header{padding:0 15px}header h1{font-size:16px}.content{padding:17px 14px}.hero{padding:24px}.hero h2{font-size:27px}.grid,.stats,.steps,.questions{grid-template-columns:1fr}.day{grid-template-columns:52px 1fr auto}.actions .btn:not(.primary){display:none}}
</style>
</head>
<body>
<div class="shell"><aside class="side" id="side"><div class="brand"><div class="logo">CB</div><div><b>CloudBlitz</b><small>XDSSAI Classroom</small></div></div><nav class="nav"><button data-v="home" class="active">⌂ &nbsp; Dashboard</button><button data-v="syllabus">▦ &nbsp; 12-Day Training</button><button data-v="project">◈ &nbsp; Project Lab</button><button data-v="review">◎ &nbsp; Day 10 Review</button><button data-v="communication">✦ &nbsp; Communication</button><button data-v="readiness">↗ &nbsp; Placement Readiness</button><button data-v="trainer">▶ &nbsp; Trainer Mode</button></nav><div class="sidefoot"><div class="bar"><i id="sidebarProgress"></i></div><p id="sideText">0% completed</p></div></aside>
<main class="main"><header><div><div class="eyebrow">CLOUDBLITZ · XDSSAI · 2026</div><h1 id="title">XDSSAI Placement Training Classroom</h1></div><div class="actions"><button class="btn mobile" id="menu">☰</button><button class="btn" onclick="window.print()">Print</button></div></header><section class="content" id="app"></section></main></div>
<script>
const days=[
[1,'Placement Introduction & Resume Building','Placement Readiness',['Placement department introduction','Placement process and expectations','Placement guidelines and responsibilities','Understanding job opportunities and roles','Resume structure and sections','ATS-friendly resume preparation','Data Science / AI skills and project alignment','Resume building activity'],'Placement process understood and first professional resume draft prepared.'],
[2,'Self-Introduction & Naukri Profile','Placement Readiness',['Professional self-introduction','2-minute and 5-minute introduction','Technical skills and project introduction','Common introduction mistakes','Naukri profile creation/optimization','Professional headline','Profile summary','Technical skills and keywords','Resume upload and profile completeness','Job search basics'],'Professional introduction prepared and Naukri profile optimized.'],
[3,'LinkedIn Profile & Documentation','Placement Readiness',['LinkedIn profile creation/optimization','Professional headline','About section','Experience and project details','Skills and certifications','GitHub/project links','Recruiter visibility','Required placement documents','Document preparation and verification','Document submission guidelines'],'LinkedIn profile and placement documentation checklist completed.'],
[4,'Recruitment Process & Resume Review','Placement Readiness',['Recruitment process overview','Job description understanding','Application and screening process','HR screening round','Technical round','Managerial round','Client round where applicable','HR/final discussion','Resume-to-JD mapping','Individual resume review','Resume corrections and improvement'],'Candidate understands recruitment stages and receives resume improvement actions.'],
[5,'Profile Review & Placement Readiness','Placement Readiness',['Professional self-introduction practice','Resume final review','LinkedIn profile review','Naukri profile review','Skills and project consistency check','Resume–LinkedIn–Naukri consistency','Profile completeness checklist','Individual feedback','Placement readiness assessment'],'Resume, LinkedIn and Naukri are aligned and placement-ready.'],
[6,'Project — Problem Understanding & Data Preparation','Project Training',['Project introduction','Business problem and objectives','Project requirements','Dataset/data sources','Data collection','Data understanding','Data cleaning','Missing values and duplicates','Data preprocessing','Project architecture and workflow'],'Project scope and data-preparation workflow established.'],
[7,'Project — EDA & Data Analysis','Project Training',['Exploratory Data Analysis','Feature understanding','Statistical analysis','Outlier identification','Data visualization','Identifying patterns and trends','Feature relationships','Business insights from data','Analysis documentation'],'EDA completed with documented findings and insights.'],
[8,'Project — Machine Learning / AI Implementation','Project Training',['Feature engineering','Model selection','Model training','Model testing','Regression/classification as applicable','Model evaluation','Performance metrics','Model comparison','Improving model performance'],'Working model/AI component with measurable evaluation results.'],
[9,'Project — End-to-End Implementation','Project Training',['Complete project workflow','Integration of project components','Final model/analysis','Dashboard/visualization where applicable','Results and findings','Project challenges and solutions','GitHub/project documentation','README preparation','Project presentation preparation'],'End-to-end project completed and portfolio-ready.'],
[10,'Project Review & Project-Based Questions','Project Review',['Complete project review','Student-wise project explanation','Problem statement questions','Dataset and preprocessing questions','EDA questions','Python/SQL questions based on project','ML/AI questions based on project','Technology selection questions','Model selection and evaluation questions','Project challenges and solutions','Scenario-based questions','Real-time troubleshooting questions','Mock project discussion'],'Student can defend project decisions and answer project-based technical questions confidently.'],
[11,'Professional Communication','Communication',['Professional communication basics','Self-introduction refinement','Speaking with confidence','Technical concept explanation','Project explanation','Professional vocabulary','HR questions','Behavioral questions','Body language','Interview etiquette'],'Student communicates technical and professional information with clarity and confidence.'],
[12,'Communication, Mock Interview & Final Readiness','Communication',['STAR method','Strengths and weaknesses','Career goals','Salary discussion','Recruiter communication','Professional email communication','Follow-up communication','Difficult interview questions','Mock interview','Trainer feedback','Final placement readiness assessment'],'Student completes mock interview and receives a final improvement plan.']
];
const qs=[['Project Understanding',['Explain your project in 2 minutes.','What business problem does it solve?','Why did you select this problem?','What was your role?','Who is the target user?']],['Data & EDA',['Where did the dataset come from?','How did you handle missing values?','How did you identify outliers?','Which features were most important?','What business insight did EDA reveal?']],['Python / SQL',['Explain the Python component you implemented.','Why did you use this SQL query?','Why was a JOIN required?','How would you optimize the query?','What data-validation checks did you perform?']],['ML / AI',['Why did you select this algorithm?','Which alternatives did you consider?','How did you split the data?','Which evaluation metric did you use and why?','How did you improve model performance?']],['Scenario & Troubleshooting',['What if model performance drops in production?','What if the dataset suddenly contains many missing values?','What if training accuracy is high but test accuracy is poor?','How would you debug an unexpected prediction?','How would you explain a technical failure to a non-technical stakeholder?']]];
let completed=JSON.parse(localStorage.getItem('cloudblitz-xdssai-progress')||'[]');let current=1;
const $=s=>document.querySelector(s);function save(){localStorage.setItem('cloudblitz-xdssai-progress',JSON.stringify(completed));updateProgress()}function done(n){return completed.includes(n)}function toggle(n){completed=done(n)?completed.filter(x=>x!==n):[...completed,n];save();render()}
function updateProgress(){let p=Math.round(completed.length/12*100);$('#sidebarProgress').style.width=p+'%';$('#sideText').textContent=p+'% completed'}
function nav(v){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));$('#side').classList.remove('open');$('#title').textContent=v==='home'?'XDSSAI Placement Training Classroom':({'syllabus':'12-Day Training','project':'Project Lab','review':'Day 10 Project Review','communication':'Professional Communication','readiness':'Placement Readiness','trainer':'Trainer Mode'}[v]||'XDSSAI Placement Training Classroom'));return v}
function home(){let p=Math.round(completed.length/12*100);return `<div class="hero"><span class="pill">CLOUDBLITZ · XDSSAI</span><h2>Placement-ready professionals through structured training and project-based learning.</h2><p>A professional classroom portal for the 12-day XDSSAI placement journey: profile readiness, project execution, project-based technical review and professional communication.</p><div class="row"><button class="btn primary" onclick="show('syllabus')">Start 12-Day Training</button><button class="btn" onclick="show('trainer')">Open Trainer Mode</button></div></div><div class="stats"><div class="stat"><small>Training Days</small><strong>12</strong></div><div class="stat"><small>Project Days</small><strong>5</strong></div><div class="stat"><small>Communication Days</small><strong>2</strong></div><div class="stat"><small>Progress</small><strong>${p}%</strong></div></div><div class="section"><div><h3>Training Architecture</h3><p>Profile → Project → Review → Communication</p></div></div><div class="grid"><div class="card accent"><h4>01 · Placement Readiness</h4><p>Days 1–5</p><ul><li>Resume building</li><li>Self-introduction & Naukri</li><li>LinkedIn & documentation</li><li>Recruitment & resume review</li><li>Final profile readiness</li></ul></div><div class="card accent"><h4>02 · Project Training</h4><p>Days 6–9</p><ul><li>Problem & data preparation</li><li>EDA & data analysis</li><li>ML / AI implementation</li><li>End-to-end project</li></ul></div><div class="card accent"><h4>03 · Project Review</h4><p>Day 10</p><ul><li>Student-wise review</li><li>Project-based questions</li><li>Scenario questions</li><li>Troubleshooting</li></ul></div><div class="card accent"><h4>04 · Communication</h4><p>Days 11–12</p><ul><li>Professional communication</li><li>Technical explanation</li><li>STAR method</li><li>Mock interview</li></ul></div><div class="card"><h4>Profile Consistency</h4><p>Keep Resume, LinkedIn, Naukri, GitHub and project story aligned.</p></div><div class="card"><h4>Trainer Workflow</h4><p>Select a day → teach → demonstrate → question → mark complete.</p></div></div>`}
function syllabus(){return `<div class="section"><div><h3>12-Day Day-Wise Syllabus</h3><p>Trainer-ready curriculum for CloudBlitz XDSSAI.</p></div><button class="btn" onclick="window.print()">Print Syllabus</button></div><div class="timeline">${days.map(d=>`<div class="day"><div class="dayno">DAY ${String(d[0]).padStart(2,'0')}</div><div onclick="openDay(${d[0]})" style="cursor:pointer"><h4>${d[1]}</h4><p>${d[2]}</p><div class="phase">${d[3].slice(0,4).join(' · ')}</div></div><button class="check ${done(d[0])?'done':''}" onclick="event.stopPropagation();toggle(${d[0]})">${done(d[0])?'✓':'○'}</button></div>`).join('')}</div>`}
function openDay(n){current=n;show('trainer')}
function trainer(){let d=days[current-1];return `<div class="hero"><span class="pill">TRAINER MODE · DAY ${String(d[0]).padStart(2,'0')} · ${d[2]}</span><h2>${d[1]}</h2><p>${d[4]}</p><div class="row"><button class="btn primary" ${current===1?'disabled':''} onclick="current--;render()">← Previous</button><button class="btn primary" ${current===12?'disabled':''} onclick="current++;render()">Next →</button><button class="btn" onclick="toggle(${d[0]})">${done(d[0])?'✓ Completed':'Mark Complete'}</button></div></div><div class="detail" style="margin-top:18px"><div class="detailmain"><span class="label">SESSION TOPICS</span><div class="topics" style="margin-top:12px">${d[3].map((x,i)=>`<div class="topic"><b>${i+1}.</b> ${x}</div>`).join('')}</div><div class="callout"><b>Expected Outcome</b><div style="color:#667085;font-size:13px;margin-top:5px">${d[4]}</div></div></div><div><div class="card"><span class="label">SESSION PROGRESS</span><h3>Day ${d[0]} / 12</h3><div class="progress"><i style="width:${d[0]/12*100}%"></i></div><p style="color:#667085;font-size:12px">Use Previous/Next to conduct the classroom session.</p></div></div></div>`}
function project(){return `<div class="hero"><span class="pill">PROJECT LAB · DAYS 06–09</span><h2>Build the project, not just the presentation.</h2><p>The project phase moves from business problem and data preparation to EDA, ML/AI implementation, integration and documentation.</p></div><div class="section"><div><h3>Four-Day Project Flow</h3><p>Use the same project throughout Days 6–9.</p></div></div><div class="steps">${[['06','Understand','Problem, objectives, requirements, data sources and architecture.'],['07','Analyze','EDA, statistics, outliers, visualization and business insights.'],['08','Build','Feature engineering, model selection, training, testing and evaluation.'],['09','Complete','Integration, results, documentation, README and presentation.']].map(s=>`<div class="card step"><div class="num">${s[0]}</div><h4>${s[1]}</h4><p>${s[2]}</p></div>`).join('')}</div><div class="section"><div><h3>Project Completion Checklist</h3><p>Everything should be ready before Day 10.</p></div></div><div class="grid">${['Problem statement documented','Dataset and preprocessing explained','EDA findings documented','Model/AI approach justified','Evaluation metrics recorded','Results and challenges documented','GitHub/README updated','Student can explain project end-to-end'].map(x=>`<div class="card"><h4>✓ ${x}</h4><p>Trainer verification point.</p></div>`).join('')}</div>`}
function review(){return `<div class="hero"><span class="pill">DAY 10 · PROJECT REVIEW</span><h2>Every question should come from the student's actual project.</h2><p>Use Day 10 to test ownership, technical reasoning, project decisions, scenarios and troubleshooting—not memorized definitions.</p></div><div class="section"><div><h3>Project-Based Question Framework</h3><p>Problem → Data → Approach → Technology → Result → Challenge → Solution</p></div></div><div class="questions">${qs.map(g=>`<div class="q"><b>${g[0]}</b>${g[1].map(q=>`<p>• ${q}</p>`).join('')}</div>`).join('')}</div><div class="section"><div><h3>Trainer Review Sequence</h3></div></div><div class="grid"><div class="card"><h4>1. Project Explanation</h4><p>Ask the student to explain the project in two minutes without reading notes.</p></div><div class="card"><h4>2. Technical Defense</h4><p>Challenge data, preprocessing, model, SQL/Python and technology decisions.</p></div><div class="card"><h4>3. Scenario Handling</h4><p>Introduce failures, changing data, poor model performance or production issues.</p></div><div class="card"><h4>4. Interview Readiness</h4><p>Check clarity, confidence, ownership and business impact.</p></div></div>`}
function communication(){return `<div class="section"><div><h3>Days 11–12 · Professional Communication</h3><p>Convert technical knowledge into confident interview communication.</p></div></div><div class="grid"><div class="card accent"><span class="label">DAY 11</span><h4>Professional Communication</h4><ul>${days[10][3].map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card accent"><span class="label">DAY 12</span><h4>Communication, Mock Interview & Final Readiness</h4><ul>${days[11][3].map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><h4>Answer Structure</h4><p>Use context → action → result → learning for behavioral and project stories.</p></div></div>`}
function readiness(){return `<div class="section"><div><h3>Final Placement Readiness</h3><p>Management-ready candidate checklist.</p></div></div><div class="grid">${[['Resume Quality','ATS-friendly structure, skills, projects and clean formatting.'],['Communication Skills','Clear articulation, confidence, structured answers and professional tone.'],['Project Completion','Working project, README, GitHub and clear explanation.'],['Job Search Readiness','LinkedIn and Naukri optimized with a focused application strategy.'],['Professional Behavior','Punctuality, responsiveness, participation and feedback implementation.']].map(x=>`<div class="card accent"><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join('')}</div><div class="section"><div><h3>Candidate Journey</h3></div></div><div class="hero"><div class="grid" style="grid-template-columns:repeat(4,1fr)"><div><b>Profile</b><p>Resume · LinkedIn · Naukri</p></div><div><b>Project</b><p>Build · Document · Explain</p></div><div><b>Review</b><p>Technical · Scenario · Troubleshoot</p></div><div><b>Interview</b><p>Communication · Mock · Feedback</p></div></div></div>`}
function show(v){nav(v);render(v)}function render(v){let html=v==='home'?home():v==='syllabus'?syllabus():v==='project'?project():v==='review'?review():v==='communication'?communication():v==='readiness'?readiness():trainer();$('#app').innerHTML=html;updateProgress()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));$('#menu').onclick=()=>$('#side').classList.toggle('open');document.addEventListener('keydown',e=>{if($('#title').textContent==='Trainer Mode'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){if(e.key==='ArrowRight'&&current<12)current++;if(e.key==='ArrowLeft'&&current>1)current--;render()}});render('home');updateProgress();
</script></body></html>
